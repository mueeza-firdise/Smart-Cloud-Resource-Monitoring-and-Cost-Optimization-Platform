<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login — CloudScale ML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="card border shadow-sm login-card">
      <div class="card-body p-4 p-md-5">
        <div class="mb-4">
          <div class="text-muted small mb-1">CloudScale ML · Educational Console</div>
          <h1 class="h4 fw-bold mb-1">Administrator Sign In</h1>
          <p class="text-muted small mb-0">
            Access the AI resource monitor, Linear Regression predictor, and auto-scaling simulator.
          </p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">
          {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('main.login') }}">
          <div class="mb-3">
            <label for="username" class="form-label small fw-semibold">Username</label>
            <input type="text" class="form-control" id="username" name="username" value="admin" required />
          </div>
          <div class="mb-4">
            <label for="password" class="form-label small fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In to Console</button>
        </form>

        <div class="mt-4 pt-3 border-top small text-muted">
          Default Credentials: <code>admin</code> / <code>admin123</code>
        </div>
      </div>
    </div>
  </body>
</html>
